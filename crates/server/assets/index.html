<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тайм-лист</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M16 10.5V16l3.6 2.4' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
  <script>
    // тема применяется до отрисовки, чтобы не мигал светлый фон
    (function () {
      var saved = localStorage.getItem('tl_theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </span>
      <span class="brand-name">Тайм-лист</span>
    </div>

    <div class="month-nav" id="month-nav">
      <button class="icon-btn" id="month-prev" title="Предыдущий месяц" aria-label="Предыдущий месяц">‹</button>
      <label class="month-title" title="Выбрать месяц">
        <span id="month-title">…</span>
        <input type="month" id="month-input" aria-label="Месяц">
      </label>
      <button class="icon-btn" id="month-next" title="Следующий месяц" aria-label="Следующий месяц">›</button>
      <button class="btn ghost small" id="month-today">Сегодня</button>
      <span class="chip lock-chip" id="lock-chip" hidden>Месяц закрыт</span>
    </div>

    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="timelist">Тайм-лист</button>
      <button role="tab" data-tab="tabel">Табель</button>
      <button role="tab" data-tab="svodka">Сводка</button>
      <button role="tab" data-tab="telegram">Telegram</button>
      <button role="tab" data-tab="periods">Отсутствия</button>
      <button role="tab" data-tab="refs">Справочники</button>
    </nav>

    <div class="topbar-right">
      <span class="bot-state" id="bot-state" title="Состояние Telegram-бота"><i></i><span>бот</span></span>
      <button class="btn ghost small" id="user-btn" title="Имя для журнала изменений">Гость</button>
      <button class="icon-btn" id="theme-btn" title="Светлая / тёмная тема" aria-label="Переключить тему">
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn ghost small" id="logout-btn" hidden>Выйти</button>
    </div>
  </header>

  <main id="main"></main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modal-title"></h3><button class="icon-btn" id="modal-close" aria-label="Закрыть">×</button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <h2>Тайм-лист</h2>
      <p class="muted">Введите пароль, чтобы продолжить.</p>
      <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Войти</button>
      <p class="error" id="login-error" hidden></p>
    </form>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
